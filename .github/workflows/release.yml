name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Release version (e.g. 0.1.0)'
                required: true
                type: string

permissions:
    contents: write
    
jobs:
    validate-version:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Validate version
              env:
                  RELEASE_VERSION: ${{ inputs.version }}
              run: |
                  PROJECT_VERSION=$(sed -n '/project(RollScript/,/)/p' CMakeLists.txt \
                      | grep -oP 'VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' \
                      | head -n 1)
                  echo "Release version: $RELEASE_VERSION"
                  echo "CMake version:   $PROJECT_VERSION"
                  if [ -z "$PROJECT_VERSION" ]; then
                      echo "::error::Could not determine project version from CMakeLists.txt"
                      exit 1
                  fi
                  if [ "$RELEASE_VERSION" != "$PROJECT_VERSION" ]; then
                      echo "::error::Release version does not match CMake project version"
                      exit 1
                  fi
                  echo "Version check successful."
            - name: Check release and tag do not exist
              env:
                  RELEASE_VERSION: ${{ inputs.version }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  TAG="v${RELEASE_VERSION}"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      echo "::error::GitHub Release $TAG already exists"
                      exit 1
                  fi
                  if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
                      echo "::error::Git tag $TAG already exists"
                      exit 1
                  fi
                  echo "Release and Tag check successful."
                  
    build:
        needs: validate-version
        uses: ./.github/workflows/build-ubuntu-24.04-reusable.yml

    release:
        needs: build
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Download AppImage
              uses: actions/download-artifact@v8
              with:
                  name: RollScript-AppImage
                  path: release

            - name: Generate release notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_VERSION: ${{ inputs.version }}
              run: |
                  TAG="v${RELEASE_VERSION}"

                  PREVIOUS_TAG=$(git tag --list 'v*' --sort=-version:refname \
                      | grep -v "^${TAG}$" \
                      | head -n 1 || true)

                  echo "Release tag:  ${TAG}"
                  echo "Previous tag: ${PREVIOUS_TAG:-<none>}"

                  if [ -n "$PREVIOUS_TAG" ]; then
                      NOTES_JSON=$(gh api \
                          --method POST \
                          "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                          -f tag_name="$TAG" \
                          -f previous_tag_name="$PREVIOUS_TAG")
                  else
                      NOTES_JSON=$(gh api \
                          --method POST \
                          "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                          -f tag_name="$TAG")
                  fi

                  echo "$NOTES_JSON" | jq -r '.body // ""' > release-notes.md

                  echo "" >> release-notes.md
                  echo "## Commits" >> release-notes.md
                  echo "" >> release-notes.md

                  if [ -n "$PREVIOUS_TAG" ]; then
                      git log "${PREVIOUS_TAG}..HEAD" \
                          --pretty=format:'- %s (`%h`)' \
                          >> release-notes.md
                  else
                      git log HEAD \
                          --pretty=format:'- %s (`%h`)' \
                          >> release-notes.md
                  fi

                  echo "" >> release-notes.md

                  echo "Generated release notes:"
                  cat release-notes.md

            - name: Create GitHub Draft Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create \
                      "v${{ inputs.version }}" \
                      release/*.AppImage \
                      --draft \
                      --title "RollScript ${{ inputs.version }}" \
                      --notes-file release-notes.md
