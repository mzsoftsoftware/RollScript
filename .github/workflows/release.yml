name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Release version (e.g. 0.1.0)'
                required: true
                type: string

permissions:
    contents: write
    
jobs:
    validate-version:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Validate version
              env:
                  RELEASE_VERSION: ${{ inputs.version }}
              run: |
                  PROJECT_VERSION=$(sed -n '/project(RollScript/,/)/p' CMakeLists.txt \
                      | grep -oP 'VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' \
                      | head -n 1)
                  echo "Release version: $RELEASE_VERSION"
                  echo "CMake version:   $PROJECT_VERSION"
                  if [ -z "$PROJECT_VERSION" ]; then
                      echo "::error::Could not determine project version from CMakeLists.txt"
                      exit 1
                  fi
                  if [ "$RELEASE_VERSION" != "$PROJECT_VERSION" ]; then
                      echo "::error::Release version does not match CMake project version"
                      exit 1
                  fi
                  echo "Version check successful."
            - name: Check release and tag do not exist
              env:
                  RELEASE_VERSION: ${{ inputs.version }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  TAG="v${RELEASE_VERSION}"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      echo "::error::GitHub Release $TAG already exists"
                      exit 1
                  fi
                  if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
                      echo "::error::Git tag $TAG already exists"
                      exit 1
                  fi
                  echo "Release and Tag check successful."
                  
    build:
        needs: validate-version
        uses: ./.github/workflows/build-ubuntu-24.04-reusable.yml

    release:
        needs: build
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              
            - name: Download AppImage
              uses: actions/download-artifact@v8
              with:
                  name: RollScript-AppImage
                  path: release
                  
            - name: Create GitHub Draft Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create \
                      "v${{ inputs.version }}" \
                      release/*.AppImage \
                      --draft \
                      --title "RollScript ${{ inputs.version }}" \
                      --generate-notes
