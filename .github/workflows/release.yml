name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Release version (e.g. 0.1.0)'
                required: true
                type: string

jobs:
    release:
        runs-on: ubuntu-24.04

        steps:
            - name: Show release version
              run: |
                  echo "Release version: ${{ inputs.version }}"
